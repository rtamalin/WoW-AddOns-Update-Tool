[project]
name = "addons-update-tool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "colorlog",
    "urllib3",
    "pyyaml",
    "dulwich>=1.2.21",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "flake8",
    "black",
    "bandit",
    "pylint",
]

[tool.black]
line-length = 79
target-version = ['py312']
preview = true
